name: Reusable Component Upload

on:
  workflow_call:
    inputs:
      namespace:
        type: string
        required: true
    secrets:
      IDF_COMPONENT_API_TOKEN:
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1        # ★ 用 ESP-IDF 官方镜像
    steps:
      - uses: actions/checkout@v4

      - name: Verify compote
        run: |
          which compote
          compote --version

      - name: Upload component
        run: |
          compote component upload \
            --namespace ${{ inputs.namespace }} \
            --name ${{ github.event.repository.name }}
        env:
          IDF_COMPONENT_API_TOKEN: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
