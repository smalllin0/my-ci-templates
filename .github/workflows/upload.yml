name: Reusable Component Upload

on:
  workflow_call:
    inputs:
      namespace:
        type: string
        required: true
    secrets:
      IDF_COMPONENT_API_TOKEN:
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4

      - name: Debug environment
        shell: bash
        run: |
          echo "IDF_PATH=$IDF_PATH"
          ls $IDF_PATH/export.sh && echo "export.sh exists"

      - name: Upload to Component Registry
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          which compote
          compote component upload \
            --namespace ${{ inputs.namespace }} \
            --name ${{ github.event.repository.name }}
        env:
          IDF_COMPONENT_API_TOKEN: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
