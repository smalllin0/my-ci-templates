name: Reuseable Component Upload

on: 
  workflow_call:
    inputs:
      namespace:
        type: string
        required: true
    secrets:
      IDF_COMPONENT_API_TOKEN:
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install component manager
        run: pip install idf-component-manager

      - name: Upload component
        run: |
          component component upload \
          --namespace ${{ inputs.namespace }} \
          --name ${{ github.event.repository.name }}
        env:
          IDF_COMPONENT_API_TOKEN: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
