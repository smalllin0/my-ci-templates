name: ESP-IDF 固件构建

on:
  workflow_call:
    inputs:
      esp_idf_version:
        type: string
        default: 'v6.1'                # ★ 和 Docker 镜像 tag 一致（不是 v6.1.0）
      targets:
        type: string
        default: '["esp32c3"]'
      example_path:
        type: string
        default: 'examples/basic'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:${{ inputs.esp_idf_version }}    # ★ 容器方式
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.targets) }}

    steps:
      # 1. 拉代码
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 缓存 ccache（大幅加速第二次编译）
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.target }}-

      # 3. 编译
      - name: Build for ${{ matrix.target }}
        shell: bash
        run: |
          . $IDF_PATH/export.sh               
          cd ${{ inputs.example_path }}
          idf.py set-target ${{ matrix.target }}
          idf.py build