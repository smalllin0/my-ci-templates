name: 主机端单元测试

on: 
  workflow_call: {}                 # 可以被其他工作流调用，但不接受任务输入参数

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools                                   # name和run是Action中常用字段
        run: sudo apt-get install -y cmake g++ ninja-build

      - name: Configure                                       # name 给步骤起名，方便在GitHub日志中查看 
        run: |                                                # run，：在虚拟机终端中执行的shell命令
          cd test
          rm -rf build
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug    

      - name: Build
        run: |
          cd test
          cmake --build build
      
      - name: Test
        run: |
          cd test
          ctest --test-dir build --output-on-failure
        

# 第一步 uses：使用`uses` 字段拉取代码
# 第二步 Configure：安装编译工具
# 第三步 Build：配置构建，`|`是YAML的多行字符串符号，表示下面每行都保留换行，相当于在终端里一行一行执行命令
# 第四步 Test：运行测试